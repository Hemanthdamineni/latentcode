# LatentCode verification spec for broken-app
# Authored per project. Declares the actions to run for E2E verification.
# LatentCode will not invent endpoints or payloads — only what's here is executed.

isolation:
  database: none            # no DB in this app; pass-through
  cleanup: drop_and_recreate
  parallel: false
  env_overrides: {}

actions:
  - name: "List products (read endpoint, should work)"
    steps:
      - method: GET
        path: /api/products
        expect_status: 200
        expect_contains:
          - id: 1
            name: "Widget"

  - name: "Login flow (POST, will fail because handler is a stub)"
    steps:
      - method: POST
        path: /api/login
        body: { email: "demo@example.com", password: "demo" }
        expect_status: 200
        save_as: login_response
      - method: GET
        path: /api/profile
        headers:
          Authorization: "Bearer ${login_response.token}"
        expect_status: 200

  - name: "Checkout (POST, will fail because handler is a stub)"
    steps:
      - method: POST
        path: /api/checkout
        body: { cart: [{ id: 1, qty: 1 }] }
        expect_status: 200
