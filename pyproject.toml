[project]
name = "latentcode"
version = "0.1.0"
description = "AI-powered analysis that finds and repairs latent defects in software projects"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
latentcode = "latentcode.cli:main"
latentcode-mcp = "latentcode.mcp_server:serve_stdio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latentcode*"]